<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArenaPick — Join</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-box">
    <div class="auth-brand">
      <div class="auth-logo">Arena<span class="accent">Pick</span></div>
      <div class="auth-sub">Join 10,000+ predictors</div>
    </div>

    <div id="alert" class="alert"></div>

    <form id="registerForm">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" id="username" class="form-input" placeholder="Your arena handle" minlength="3" maxlength="50" required>
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" id="email" class="form-input" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" id="password" class="form-input" placeholder="Min 6 characters" minlength="6" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg" id="submitBtn">Create Account</button>
    </form>

    <div class="auth-footer">
      Already in? <a href="/">Sign in</a>
    </div>
  </div>
</div>
<script>
  document.getElementById('registerForm').addEventListener('submit', async e => {
    e.preventDefault();
    const btn     = document.getElementById('submitBtn');
    const alertEl = document.getElementById('alert');
    alertEl.className = 'alert';
    btn.disabled = true;
    btn.textContent = 'Creating account…';

    const res  = await fetch('/api/auth/register', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value,
        email:    document.getElementById('email').value,
        password: document.getElementById('password').value,
      })
    });
    const data = await res.json();
    if (res.ok) {
      alertEl.textContent = '✓ Account created! Heading to the arena…';
      alertEl.className = 'alert success show';
      setTimeout(() => window.location.href = '/dashboard.html', 800);
      return;
    }
    alertEl.textContent = data.error || 'Registration failed';
    alertEl.className = 'alert error show';
    btn.disabled = false;
    btn.textContent = 'Create Account';
  });
</script>
</body>
</html>
